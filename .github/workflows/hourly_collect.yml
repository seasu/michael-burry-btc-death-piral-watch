name: Hourly Collect

on:
  schedule:
    - cron: "0 * * * *"   # UTC 每小時整點
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect data
        env:
          SYMBOL: ${{ vars.SYMBOL || 'BTCUSDT' }}
        run: python scripts/collect.py

      - name: Sync data to docs/ for GitHub Pages
        run: |
          mkdir -p docs/data
          cp data/latest.json docs/data/latest.json
          cp data/history.csv docs/data/history.csv

      - name: Commit & push (only if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.csv docs/data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: hourly collect $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
