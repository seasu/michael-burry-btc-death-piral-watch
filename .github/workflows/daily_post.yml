name: Daily Post

on:
  schedule:
    - cron: "0 1 * * *"   # UTC 01:00 = TPE 09:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect fresh data first
        env:
          SYMBOL: ${{ vars.SYMBOL || 'BTCUSDT' }}
        run: python scripts/collect.py

      - name: Generate post & daily audit JSON
        env:
          SYMBOL: ${{ vars.SYMBOL || 'BTCUSDT' }}
          REPO_HTTP_URL: ${{ vars.REPO_HTTP_URL }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          HASHTAGS: ${{ vars.HASHTAGS }}
        run: python scripts/make_post.py

      - name: Sync data to docs/ for GitHub Pages
        run: |
          mkdir -p docs/data
          cp data/latest.json docs/data/latest.json
          cp data/history.csv docs/data/history.csv

      - name: Commit & push audit files first
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.csv data/daily/ posts/ docs/data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "post: daily audit $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Post to X
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_POST_URL: ${{ secrets.X_POST_URL || 'https://api.x.com/2/tweets' }}
        run: python scripts/post_to_x.py

      - name: Commit error file if post failed
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/*.error.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No error file to commit."
          else
            git commit -m "post: error log $(date -u +'%Y-%m-%d')"
            git push
          fi
